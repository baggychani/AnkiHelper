name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build bundled Python engine
        run: python scripts/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: Anki Helper v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: Anki-Helper_[version]_[arch][setup].[ext]
