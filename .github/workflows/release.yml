name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (비우면 코드 버전을 사용, 예: v1.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Validate release tag and app version
        id: release
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw frontend/package.json | ConvertFrom-Json).version
          $enteredTag = '${{ inputs.tag }}'.Trim()
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $enteredTag) { $enteredTag } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "v$packageVersion" } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "릴리스 태그는 v1.2.0 형식이어야 합니다: $tag"
          }
          $version = $Matches.version
          $versions = @(
            $packageVersion,
            (Get-Content -Raw frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version,
            (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value,
            (Select-String -Path frontend/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value,
            (Select-String -Path src/anki_helper/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          )
          $mismatches = $versions | Where-Object { $_ -ne $version }
          if ($mismatches) {
            throw "태그 $tag 와 앱 버전이 일치하지 않습니다. 모든 매니페스트를 $version 으로 맞춘 뒤 다시 실행하세요."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build bundled Python engine
        run: python scripts/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Anki Helper ${{ steps.release.outputs.tag }}
          generateReleaseNotes: false
          releaseBody: |
            Windows용 Anki Helper 설치 파일입니다.

            1. 아래 설치 파일을 다운로드합니다.
            2. 설치 후 Anki Helper를 실행합니다.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: AnkiHelper-Setup-v[version]-Windows-x64.[ext]
