name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (비우면 코드 버전을 사용, 예: v1.2.0)"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: checks
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Validate release tag and app version
        id: release
        env:
          ENTERED_TAG: ${{ github.event.inputs.tag }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw frontend/package.json | ConvertFrom-Json).version
          $enteredTag = if ($null -eq $env:ENTERED_TAG) { "" } else { $env:ENTERED_TAG.Trim() }
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $enteredTag) {
            $enteredTag
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            "v$packageVersion"
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "릴리스 태그는 v1.2.0 형식이어야 합니다: $tag"
          }
          $version = $Matches.version
          $versions = @(
            $packageVersion,
            (Get-Content -Raw frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version,
            (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value,
            (Select-String -Path frontend/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value,
            (Select-String -Path src/anki_helper/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          )
          $mismatches = $versions | Where-Object { $_ -ne $version }
          if ($mismatches) {
            throw "태그 $tag 와 앱 버전이 일치하지 않습니다. 모든 매니페스트를 $version 으로 맞춘 뒤 다시 실행하세요."
          }
          $prerelease = if ($version -match "-") { "true" } else { "false" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Import Windows code-signing certificate
        id: codesign
        if: env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -Password $secure -CertStoreLocation Cert:\CurrentUser\My
          $env:CERT_THUMBPRINT = $cert.Thumbprint
          python scripts/patch_windows_signing.py

      - name: Note unsigned Windows build
        if: env.HAS_WINDOWS_CERTIFICATE != 'true'
        run: echo "WINDOWS_CERTIFICATE secret is not set. The installer will be unsigned and may show SmartScreen."

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build bundled Python engine
        run: python scripts/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Anki Helper ${{ steps.release.outputs.tag }}
          generateReleaseNotes: false
          releaseBody: |
            Windows용 Anki Helper 설치 파일입니다.

            1. 아래 설치 파일을 다운로드합니다.
            2. 설치 후 Anki Helper를 실행합니다.
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          releaseAssetNamePattern: AnkiHelper-Setup-v[version]-Windows-x64[ext]
