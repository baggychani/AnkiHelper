[project]
name = "anki-helper"
version = "0.1.0"
description = "Anki APKG inspector and export helper"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "PySide6-WebEngine>=6.7", "zstandard>=0.23"]

[project.scripts]
anki-helper = "anki_helper.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
