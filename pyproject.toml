[project]
name = "anki-helper"
version = "1.2.2"
description = "Desktop editor for Anki APKG packages"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "zstandard>=0.23"]

[project.scripts]
anki-helper = "anki_helper.backend:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
